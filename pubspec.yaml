name: screenshot_manager
description: A smart screenshot manager app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

# DEPENDENCIES FOR THE NEW FUNCTIONALITY:
# permission_handler: To request storage permissions.
# path_provider: To find default storage directories.
# shared_preferences: To save the user's settings.
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  google_fonts: ^6.2.1
  intl: ^0.19.0
  permission_handler: ^11.3.1
  shared_preferences: ^2.2.3
  device_apps: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

# IMPORTANT: For Android 10 (API 29) and above, you must add this to your
# android/app/src/main/AndroidManifest.xml inside the <application> tag
# to access external storage outside your app's sandbox:
#
# <application
#     ...
#     android:requestLegacyExternalStorage="true"
#     ...>
#
# You also need to declare storage permissions in the same file, outside the <application> tag:
#
# <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
# <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
#
# For iOS, add corresponding keys to your Info.plist file.